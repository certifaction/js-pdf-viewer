name: Publish

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages (npm)
    if: ${{ github.event.pull_request.merged == true && startsWith(github.head_ref, 'releases/') == true }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: jdx/mise-action@v5
        # No caches in release jobs, to prevent cache poisoning.
        with:
          cache: false

      - name: Extract package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Configure Git user
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Create Git tag
        run: |
          TAG="v${PACKAGE_VERSION}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish to GitHub Packages
        run: |
          pnpm config set "//npm.pkg.github.com/:_authToken=${{ github.token }}"
          if [ ${{ contains(env.PACKAGE_VERSION, '-') == true }} == true ]; then
              pnpm publish --tag next
          else
              pnpm publish
          fi

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.PACKAGE_VERSION }}
          prerelease: ${{ contains(env.PACKAGE_VERSION, '-') }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
